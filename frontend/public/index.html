<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0070f3" />
    <meta
      name="description"
      content="Battle.Net Quiz Platform - Real-time multiplayer quiz platform"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Battle.Net Quiz Platform</title>
    
    <!-- Theme Initialization Script - Runs BEFORE React to prevent flash -->
    <script>
      (function() {
        try {
          const STORAGE_KEY = 'battlenet-theme';
          const stored = localStorage.getItem(STORAGE_KEY);
          
          // Default to dark mode if no preference is stored
          let theme = stored || 'dark';
          
          // If theme is 'auto', resolve based on system preference
          if (theme === 'auto') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          
          // Apply theme immediately to prevent flash
          document.documentElement.setAttribute('data-theme', theme);
          
          // Update meta theme-color
          const metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', theme === 'dark' ? '#18181b' : '#ffffff');
          }
          
          // Store dark as default if nothing was stored
          if (!stored) {
            localStorage.setItem(STORAGE_KEY, 'dark');
          }
        } catch (e) {
          // Fail silently
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
